[project]
name = "agora-glass"
version = "0.1.0"
description = "Antigravity Glass-Box Sentinel: Autonomous Liquidation Protection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncio>=3.4.3",
    "web3>=7.0.0",
    "polars>=1.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "hyperliquid-python-sdk>=0.23.0",
    "circle-developer-controlled-wallets>=1.0.0",
    "mcp>=1.27.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
